spring:
  application:
    name: springboot-demo

server:
  port: 8080

agentscope:
  agent:
    name: assistant
    system-prompt: You are a helpful AI assistant.
    model: ${AGENTSCOPE_MODEL:deepseek-flash}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${AGENTSCOPE_BASE_URL:https://api.deepseek.com}
    enable-thinking: ${AGENTSCOPE_ENABLE_THINKING:false}
    skills-dir: ${AGENTSCOPE_SKILLS_DIR:skills}
    workspace: ${AGENTSCOPE_WORKSPACE:.agentscope/workspace}
  news:
    base-url: ${FINANCIAL_NEWS_BASE_URL:https://www.cls.cn/api/cache}
    max-records: ${FINANCIAL_NEWS_MAX_RECORDS:8}
  pushplus:
    token: ${PUSHPLUS_TOKEN:}
    base-url: ${PUSHPLUS_BASE_URL:https://www.pushplus.plus/send}
  stock:
    base-url: ${STOCK_QUOTE_BASE_URL:https://push2.eastmoney.com/api/qt/stock/get}
    tencent-base-url: ${TENCENT_STOCK_QUOTE_BASE_URL:http://qt.gtimg.cn/q}
  market-index:
    tencent-base-url: ${MARKET_INDEX_TENCENT_BASE_URL:http://qt.gtimg.cn/q}
